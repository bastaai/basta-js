  """The item's schema_id."""
  itemSchemaId: ID

  """The target's schema_id."""
  targetSchemaId: ID

  """Whether the item and target reference the same schema_id."""
  schemaIdMatches: Boolean!

  """True when schemaIdMatches is true and there are no drifting entries."""
  inSync: Boolean!

  """The drifting keys. Empty when in sync."""
  entries: [ContentDiffEntry!]!

  """
  Target keys not present as public fields in the item's schema. Names only.
  """
  removableKeys: [String!]!

  """Creator-set drift. Null when not computed (e.g. non-SALE_ITEM target)."""
  creators: GroupSyncDiff

  """Category-set drift. Null when not computed."""
  categories: GroupSyncDiff

  """Tag-set drift. Null when not computed."""
  tags: GroupSyncDiff

  """Image-set drift. Null when not computed."""
  images: GroupSyncDiff

  """
  Template override drift (title/subTitle/description). Null when syncTemplates was off.
  """
  templates: TemplateSyncDiff

  """
  True when the source and target condition reports differ in text or condition images (before the write, for a sync). Null when not compared.
  """
  conditionReportChanged: Boolean
}

"""A single drifting schema_data key."""
type ContentDiffEntry {
  """The schema_data property name."""

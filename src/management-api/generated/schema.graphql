"""Stage of a user's identity verification."""
enum IdVerificationState {
  """The user has not started identity verification."""
  NONE

  """A verification has been started but the user has not submitted it yet."""
  REQUESTED

  """The user has submitted the verification and it is being checked."""
  PROCESSING

  """The user's identity has been verified."""
  VERIFIED

  """The verification did not succeed. The user can start a new one."""
  FAILED

  """The verification was canceled. The user can start a new one."""
  CANCELED
}

"""
An account's identity verification settings, one member per provider. The secret key
is never returned.
"""
union IdentityVerificationProvider = StripeIdentityProviderSettings

"""
The provider to set up, exactly one of the fields. Switching provider on a configured
account needs that provider's secret key.
"""
input IdentityVerificationProviderInput {
  """Stripe Identity on the account's own Stripe account."""
  stripeIdentity: StripeIdentityProviderInput
}


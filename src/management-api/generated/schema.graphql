  """Fetch information about an Item by external identifier"""
  itemByExternalId(accountId: String!, externalId: String!): Item!

  """
  Get all items for accountId
  
  onlyMyItems if true filters items belonging to the current user
  """
  items(accountId: String!, first: Int = 20, after: String, itemsFilter: ItemsFilter!, direction: PaginationDirection = FORWARD): ItemsConnection!

  """Get a single consignment by id."""
  consignment(accountId: String!, consignmentId: String!): Consignment!

  """
  The account's couriers whose name starts with query, ignoring case, ordered by name.

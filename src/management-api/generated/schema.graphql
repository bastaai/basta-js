}

"""
Whether a sale's effective key date is an explicit override or computed from the account offset.
"""
enum WorkflowScheduleDateSource {
  OVERRIDE
  COMPUTED
}

enum WorkflowScheduleDimension {
  LIVE
  TIMED
  PRINTED_CATALOGUE
}

"""
This account's workflow schedule grid, one row per configured date type, in display order.
"""
type WorkflowScheduleOffsets {
  rows: [WorkflowScheduleRow!]!
}

"""
One workflow date row: its enabled state, display order, and per-dimension offsets.
"""
type WorkflowScheduleRow {
  dateType: WorkflowDateType!
  enabled: Boolean!
  sortOrder: Int!
  offsets: [WorkflowDimensionOffset!]!

  """
  True when this row differs from the platform default; false when it is the platform default.
  """
  modified: Boolean!
}

input WorkflowScheduleRowInput {
  dateType: WorkflowDateType!
  enabled: Boolean!
  sortOrder: Int!
  offsets: [WorkflowDimensionOffsetInput!]!
}

"""
The account's workflow settings: per-account toggles for optional workflows.
"""
type WorkflowSettings {
  """
  Whether the cataloguing workflow (awaiting cataloguing, catalogued, proofed) is enabled for this account.
  """
  cataloguingWorkflowEnabled: Boolean!

  """
  Whether the AMS should warn before publishing a sale that has items without a display (lot) number. Defaults to false.
  """
  requireDisplayNumbersToPublish: Boolean!

  """
  Whether the photography workflow (to photograph, photographed, uploaded) is enabled for this account. Defaults to false.
  """
  photographyWorkflowEnabled: Boolean!

  """
  Whether clients must be logged in to view and request condition reports on the house's website. Defaults to false.
  """
  conditionReportsRequireLogin: Boolean!
}
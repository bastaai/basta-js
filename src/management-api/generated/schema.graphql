  """
  Enable or disable countries for the account. Returns the refreshed country list.
  """
  setAccountCountriesEnabled(accountId: ID!, codes: [Country!]!, enabled: Boolean!): [CountryInfo!]!

  """
  Set a country's AML risk class for the account. Returns the refreshed country list.
  """
  setAccountCountryAmlRiskClass(accountId: ID!, code: Country!, amlRiskClass: AmlRiskClass!): [CountryInfo!]!

  """
  Set the per-account auction symbol glyphs for ARR / VAT / CITES.
  Replaces all glyphs at once; an empty glyph clears that symbol.
  """
  setAuctionSymbols(accountId: String!, input: [AuctionSymbolInput!]!): Account!

  """
  Replace the account's document branding. The logo must be a PNG or JPEG
  asset of this account whose upload is complete.
  """
  updateDocumentBranding(accountId: String!, input: DocumentBrandingInput!): Account!

  """
  Save a new version of the account's consignment contract template. It becomes
  the template for new contracts; earlier versions are kept unchanged.
  """
  createConsignmentContractTemplateVersion(accountId: String!, input: CreateConsignmentContractTemplateVersionInput!): ConsignmentContractTemplate!

  """
  Set the number the next created client in the account receives. Must be greater than
  every client number already in use in the account.
  """
  setNextClientNumber(accountId: String!, nextClientNumber: Int!): ClientNumberSettings!

  """
  Set the number the next created sale in the account receives. Must be greater than
  every sale number already in use in the account.
  """
  setNextSaleNumber(accountId: String!, nextSaleNumber: Int!): SaleNumberSettings!

  """
  Set up identity verification for the account's clients, or turn it on or off. Pass the
  credentials of exactly one provider; its input type documents the setup steps. Switching
  provider needs that provider's secret key.
  """
  setIdentityVerificationProvider(
    accountId: ID!

    """Whether the account's clients can verify their identity."""
    enabled: Boolean!
    provider: IdentityVerificationProviderInput!
  ): IdentityVerificationProvider!

  """Create a sale"""
  createSale(accountId: String!, input: CreateSaleInput!): Sale!

  """Create a Dutch sale"""
  createDutchSale(accountId: String!, input: CreateDutchSaleInput!): DutchSale!

  """
  Update a Dutch sale's content (title / description).
  null leaves a field unchanged; empty string clears it.
  """
  updateDutchSale(accountId: String!, input: UpdateDutchSaleInput!): DutchSale!

  """Update a sale"""
  updateSale(accountId: String!, saleId: String!, input: UpdateSaleInput!): Sale!

  """
  Attach one or more departments to a sale (add-only; already-assigned
  departments are ignored). Returns the updated sale.
  """
  addSaleDepartments(accountId: ID!, saleId: ID!, departmentIds: [ID!]!): Sale!

  """Remove a single department from a sale. Returns the updated sale."""
  removeSaleDepartment(accountId: ID!, saleId: ID!, departmentId: ID!): Sale!

  """
  Create a department for an account. The slug is derived from the name
  when omitted; supply slug to override it. Returns the created department.
  """
  createDepartment(accountId: ID!, name: String!, slug: String): Department!

  """Rename an existing department. Returns the updated department."""
  updateDepartment(accountId: ID!, id: ID!, name: String!): Department!

  """
  Soft-delete a department. The record is retained and can be brought back
  with restoreDepartment. Returns the deleted department.
  """
  deleteDepartment(accountId: ID!, id: ID!): Department!

  """
  Restore a previously soft-deleted department. Returns the restored department.
  """
  restoreDepartment(accountId: ID!, id: ID!): Department!

  """
  Create an auction genre for an account. The slug is derived from the name
  when omitted; supply slug to override it. Returns the created auction genre.
  """
  createSaleGenre(
    accountId: ID!
    name: String!
    slug: String

    """Defaults to true when omitted."""
    isPublic: Boolean
  ): SaleGenre!

  """
  Update an existing auction genre's name and visibility. Returns the updated
  auction genre.
  """
  updateSaleGenre(
    accountId: ID!
    id: ID!
    name: String!

    """Omit to leave the current value unchanged."""
    isPublic: Boolean
  ): SaleGenre!

  """
  Archive an auction genre. The record is retained and can be brought back
  with restoreSaleGenre. Returns the archived auction genre.
  """
  archiveSaleGenre(accountId: ID!, id: ID!): SaleGenre!

  """
  Restore a previously archived auction genre. Returns the restored auction genre.
  """
  restoreSaleGenre(accountId: ID!, id: ID!): SaleGenre!

  """
  Hard-delete an auction genre. Rejected when the genre is assigned to any
  sale. Returns the deleted auction genre.
  """
  deleteSaleGenre(accountId: ID!, id: ID!): SaleGenre!

  """
  Create or edit a section marker on a sale. Omit input.id to create; supply a
  known id to edit in place. Returns the updated sale.
  """
  setSectionMarker(accountId: ID!, saleId: ID!, input: SetSectionMarkerInput!): Sale!

  """Remove a section marker from a sale by id. Returns the updated sale."""
  removeSectionMarker(accountId: ID!, saleId: ID!, id: ID!): Sale!

  """
  Set or update the sale slug (pretty URL) for a sale. Creates if none exists; updates otherwise.
  """
  setSaleSlug(accountId: String!, input: SetSaleSlugInput!): SaleSlug!

  """
  Set or update the sale item slug (pretty URL) for an item in a sale. Creates if none exists; updates otherwise.
  """
  setSaleItemSlug(accountId: String!, input: SetSaleItemSlugInput!): SaleItemSlug!

  """Open a sale, non forcefully."""
  openSale(accountId: String!, input: OpenSaleInput!): Sale!

  """Close a sale, non forcefully."""
  closeSale(accountId: String!, input: CloseSaleInput!): Sale!

  """
  Set Sale State unforcefully.
  Setting PUBLISHED checks the required fields of every lot that is not hidden or withdrawn, and fails with LOTS_MISSING_REQUIRED_FIELDS when any are blank.
  """
  setSaleStatus(accountId: String!, input: SetSaleStatusInput!): Sale!

  """Start to close the sale, non forcefully"""
  startClosingSale(accountId: String!, input: StartClosingSaleInput!): Sale!

  """
  Open a sale, forcefully.
  Lots' required fields are not checked.
  """
  forceOpenSale(accountId: String!, input: OpenSaleInput!): Sale!

  """
  Close a sale, forcefully.
  Lots' required fields are not checked.
  """
  forceCloseSale(accountId: String!, input: CloseSaleInput!): Sale!

  """
  Start to close the sale, forcefully.
  Lots' required fields are not checked.
  """
  forceStartClosingSale(accountId: String!, input: StartClosingSaleInput!): Sale!

  """
  Publish a sale.
  Checks the required fields of every lot that is not hidden or withdrawn, and fails with LOTS_MISSING_REQUIRED_FIELDS when any are blank.
  """
  publishSale(accountId: String!, input: PublishSaleInput!): Sale!


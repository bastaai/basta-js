  """
  Sent when a sale status change associated with your account occurs in the system.
  """
  SALE_STATUS_CHANGED

  """Sent when a sale is created associated with your account"""
  SALE_CREATED

  """Sent when an item is added to a sale in your account"""
  ITEM_ADDED_TO_SALE

  """Sent when SaleItem is updated"""
  SALE_ITEM_UPDATED

  """Sent when a SaleItem is removed from sale"""
  SALE_ITEM_REMOVED

  """Sent when bids are cancelled (removed) on an item in sale."""
  CANCEL_BID_ON_ITEM

  """Sent when an order is created"""
  ORDER_CREATED

  """Sent when an order is updated"""
  ORDER_UPDATED

  """Sent when an order is cancelled"""
  ORDER_CANCELLED

  """Sent when a sale is updated"""
  SALE_UPDATED

  """Sent when a sale registration is created"""
  SALE_REGISTRATION_CREATED

  """Sent when a sale registration is updated"""
  SALE_REGISTRATION_UPDATED

  """Sent when a sale registration is deleted"""
  SALE_REGISTRATION_DELETED

  """Sent when a sale item registration is created"""
  SALE_ITEM_REGISTRATION_CREATED

  """Sent when a sale item registration is deleted"""
  SALE_ITEM_REGISTRATION_DELETED

  """Sent when a user is created"""
  USER_CREATED

  """Sent when a user is updated"""
  USER_UPDATED

  """When a user favourites a sale item"""
  SALE_ITEM_WATCHLIST_ENTRY_CREATED

  """When a user unfavourites a sale item"""
  SALE_ITEM_WATCHLIST_ENTRY_DELETED

  """When a user favourites a sale"""
  SALE_WATCHLIST_ENTRY_CREATED

  """When a user unfavourites a sale"""
  SALE_WATCHLIST_ENTRY_DELETED

  """Sent when a bid's user ID is changed on an item"""
  BID_USER_ID_CHANGED

  """Sent when a marketplace order is placed"""
  MARKETPLACE_ORDER_PLACED

  """
  Sent on every state transition of a marketplace order (e.g. Shipped, Delivered)
  """
  MARKETPLACE_ORDER_STATE_CHANGED

  """Sent when a marketplace order is cancelled"""
  MARKETPLACE_ORDER_CANCELLED

  """Sent when a marketplace product is created"""
  MARKETPLACE_PRODUCT_CREATED

  """Sent when a marketplace product is updated"""
  MARKETPLACE_PRODUCT_UPDATED

  """Sent when a marketplace product is deleted"""
  MARKETPLACE_PRODUCT_DELETED

  """Sent when a marketplace product variant is created"""
  MARKETPLACE_PRODUCT_VARIANT_CREATED

  """Sent when a marketplace product variant is updated"""
  MARKETPLACE_PRODUCT_VARIANT_UPDATED

  """Sent when a marketplace product variant is deleted"""
  MARKETPLACE_PRODUCT_VARIANT_DELETED

  """Sent when a dutch sale is created"""
  DUTCH_SALE_CREATED

  """Sent when a dutch item is created"""
  DUTCH_ITEM_CREATED

  """Sent when a dutch item's metadata is updated"""
  DUTCH_ITEM_UPDATED

  """Sent when a dutch item's lifecycle status changes"""
  DUTCH_ITEM_STATUS_CHANGED

  """Sent when a dutch bid is accepted"""

  """
  The item type this item is assigned to, if any. Its `effectiveSchema`
  gives the field definitions.
  """
  itemType: ItemType

  """The effective schema (field definitions) for this item's item type."""
  effectiveSchema: JSON

  """The item's filled-in field values, conforming to `effectiveSchema`."""
  attributes: JSON

  """The item type this item is assigned to, if any."""
  type: ItemType @deprecated(reason: "Renamed to itemType.")

  """The effective schema (field definitions) for this item's item type."""
  schema: JSON @deprecated(reason: "Renamed to effectiveSchema.")

  """Item Notes."""
  itemNotes(take: Int = 5, cursor: String = "", direction: PaginationDirection = BACKWARDS): ItemNoteConnection! @deprecated(reason: "Use notes instead.")

  """Internal staff notes on this item."""
  notes(first: Int = 20, after: String): NoteConnection!

  """
  Alert notes for this item (notes flagged as alerts, for banner display).
  """
  alerts: [Note!]!

  """
  Item specifications (dimensions, weight, type, etc.) - first specification only. Use specificationsV2 for full list.
  """
  specifications: ItemSpecifications @deprecated(reason: "Use specificationsV2")

  """Item specifications v2 (list with id, quantity, diameter, etc.)"""
  specificationsV2: [ItemSpecifications!]!

  """Item packaging (boxed dimensions and weight)"""
  packaging: [ItemPackaging!]!

  """Item estimate in minor currency unit."""
  estimates: Estimate! @deprecated(reason: "Use price")

  """Valuation of the item in minor currency units."""
  valuationAmount: Int @deprecated(reason: "Will be removed in the future")

  """Valuation currency"""
  valuationCurrency: String @deprecated(reason: "Will be removed in the future")

  """Sale Id, if the item is linked to a sale"""
  saleId: String @deprecated(reason: "Will be removed in the future")

  """Location of the item"""
  location: String

  """Metafields associated with the item"""
  metafields(input: GetMetafieldsInput!): [Metafield!]!

  """Metafield associated with the item"""
  metafield(input: GetMetafieldInput!): Metafield

  """The consignment this item belongs to, if any."""
  consignment: Consignment

  """The earliest appraisal this item is in, if any."""
  appraisal: Appraisal @deprecated(reason: "Use appraisals")

  """Appraisals this item is in, earliest first."""
  appraisals: [Appraisal!]!

  """
  The item's line in each appraisal it is in, earliest link first. Line numbers are
  per appraisal and differ from inventoryNumber and from the item's position in a sale.
  """
  appraisalLines: [AppraisalLine!]!

  """
  The item's line number within its consignment. Never changes and is never reused.
  Per consignment; differs from inventoryNumber and from the item's position in a sale.
  Null when the item is not consigned or the number is not yet assigned.
  """
  consignmentLineNumber: Int

  """
  The appraisal line the item was transferred from into its consignment. Null when the
  item is not in a consignment, was consigned directly, or its source appraisal was deleted.
  """
  consignedFrom: AppraisalLine

  """The site this item currently resides at, if any."""
  site: Site

  """The location within its site this item currently resides at, if any."""
  siteLocation: Location

  """
  Where the item physically is. AT_LOCATION when it has a site, else IN_TRANSIT
  while in transit, else WITH_CLIENT when it is consigned. Null otherwise.
  """
  locationStatus: ItemLocationStatus

  """
  When the item went into transit. Null unless locationStatus is IN_TRANSIT.
  """
  inTransitSince: Time

  """
  The latest property receipt issued for the item in its current consignment. Null when none.
  """
  propertyReceipt: PropertyReceiptRef

  """Categories assigned to the item"""
  categories: [Category!]!

  """Creators assigned to the item"""
  creators: [Creator!]!

  """
  Whether the Artist's Resale Right applies to this item. Follows the item's
  creators unless arrOverride is set.
  """
  arr: Boolean!

  """
  The value set directly on this item, if any. Null means the item follows its
  creators.
  """
  arrOverride: Boolean

  """
  Marketplace product variants (buy-now items) linked to this inventory item.
  """
  productVariants(first: Int = 20, after: String): ProductVariantConnection!

  """
  Offer configuration for this item; null when the item does not accept offers.
  """
  offerConfig: ItemOfferConfig

  """Offers placed on this item."""
  offers(first: Int, after: String, status: OfferStatus, direction: PaginationDirection): OffersConnection!

  """
  schemaData drift between this item and its targets. targetKind selects
  sale items or product variants; omitted defaults to sale items.
  """
  contentDrift(targetKind: ContentDiffTargetKind): [ContentDiff!]!

  """
  Everywhere this item's content is linked: auction sale items and
  marketplace product variants.
  """
  links: ItemLinkConnection!

  """
  Overall lifecycle status of the item (acquisition to disposal), distinct from
  the item's auction status within a sale.
  """
  lifecycleStatus: ItemLifecycleStatus

  """
  Where the item sits in the cataloguing workflow: awaiting cataloguing, catalogued,
  or proofed. An item with no explicitly set status reads as awaiting cataloguing;
  null only if the item cannot be loaded.
  """
  cataloguingWorkflowStatus: CataloguingWorkflowStatus

  """
  Where the item sits in the photography workflow: to photograph, photographed, or
  uploaded. An item with no explicitly set status reads as to photograph; null only
  if the item cannot be loaded.
  """
  photographyWorkflowStatus: PhotographyWorkflowStatus

  """The dashboard member currently assigned as staff lead for this item."""
  staffLead: DashboardMember

  """CITES licence number, when the item is subject to CITES regulations."""
  citesLicenceNumber: String

  """
  The account's inventory number for this item: sequential per account and assigned
  when the item is created. It is not the item's position in a sale.
  Null for items created before inventory numbers were introduced.
  """
  inventoryNumber: Int

  """Timestamp when the item was created."""
  created: String!
}


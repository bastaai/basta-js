"""
Directs the executor to defer this fragment when the `if` argument is true or undefined.
"""
directive @defer(
  """Deferred when true or undefined."""
  if: Boolean = true

  """Unique name"""
  label: String
) on FRAGMENT_SPREAD | INLINE_FRAGMENT

directive @hasPermission(permission: Permission!) on FIELD_DEFINITION

type Account {
  """ID of the account"""
  id: ID!

  """Name associated with account"""
  name: String!

  """Account handle, identifier for the account"""
  handle: String

  """Description for account"""
  description: String

  """Url for the profile image"""
  imageUrl: String

  """Links associated with account"""
  links: [Link!]!

  """Indicates whether account is using basta's bid client"""
  bastaBidClient: Boolean!

  """
  When true, only logged-in clients can request condition reports, and the website shows
  reports only to logged-in clients.
  """
  conditionReportsRequireLogin: Boolean!

  """
  Is logged-in user subscribed to account ?
  Only applies to sales running on basta.app (false for all api clients)
  """
  isUserSubscribed: Boolean!

  """PaymentDetails set by account"""
  paymentDetails: PaymentDetails

  """Metafields associated with the account"""
  metafields(input: GetMetafieldsInput): [MetafieldsConnection!]!

  """Metafield associated with the account"""
  metafield(input: GetMetafieldInput!): Metafield

  """
  Departments of the account, ordered alphabetically by name.
  Pass the previous page's endCursor as `after` to fetch the next page.
  """
  departments(
    """Number of departments to return, at most 200."""
    first: Int = 50
    after: String
  ): DepartmentConnection!

  """
  Visible staff of the account, ordered by name.
  Pass the previous page's endCursor as `after` to fetch the next page.
  """
  staffProfiles(
    """Number of staff profiles to return, at most 200."""
    first: Int = 50
    after: String

    """Only staff in this department."""
    departmentId: ID
  ): StaffProfileConnection!
}

enum AddressType {
  BILLING
  SHIPPING
  OTHER
}

type Aggregator {
  name: String!
  type: BidOriginType!
}

"""An appointment the logged-in user requested at an auction house site."""
type Appointment {
  id: ID!
  type: AppointmentType!
  status: AppointmentStatus!

  """Null when the site no longer exists."""
  site: Site

  """The start the user asked for (RFC3339)."""
  preferredStart: String!

  """The end the user asked for (RFC3339). Null when not given."""
  preferredEnd: String

  """The start the house confirmed (RFC3339). Null until confirmed."""
  scheduledStart: String

  """The end the house confirmed (RFC3339). Null when not set."""
  scheduledEnd: String

  """The user's note to the house. Null when not given."""
  note: String

  """
  True when the house cancelled, false when the user did. Null unless cancelled.
  """
  cancelledByHouse: Boolean

  """Why the appointment was cancelled. Null when no reason was given."""
  cancellationReason: String

  """
  The invoices and statements the appointment is for. Empty for a valuation.
  """
  documents: [AppointmentDocument!]!

  """When the appointment was requested (RFC3339)."""
  created: String!
}

"""What the logged-in user can book at this auction house."""
type AppointmentBookingOptions {
  """Whether the house takes appointment requests."""
  enabled: Boolean!

  """
  The sites an appointment can be requested at. Empty when enabled is false.
  """
  sites: [Site!]!

  """
  The earliest preferredStart the house accepts (RFC3339). Null when enabled is false.
  """
  earliestStart: String

  """
  The latest preferredStart the house accepts (RFC3339). Null when enabled is false.
  """
  latestStart: String
}

"""Pass pageInfo.endCursor as after to get the next page."""
type AppointmentConnection {
  edges: [AppointmentEdge!]!
  pageInfo: PageInfo!
}

"""
An invoice or statement an appointment is for, as it was when the appointment was requested.
"""
type AppointmentDocument {
  type: AppointmentDocumentType!
  documentId: ID!

  """The document's number. Null when it has none."""
  number: String
  saleId: ID!

  """The items to collect. Empty means every item on the document."""
  itemIds: [ID!]!
}

input AppointmentDocumentInput {
  type: AppointmentDocumentType!

  """
  The invoice or statement id. Must be the user's own: an invoice billed to them, or an issued statement addressed to them.
  """
  documentId: ID!

  """
  Items on the document to collect. Omit or leave empty to collect every item on it.
  """
  itemIds: [ID!]
}

enum AppointmentDocumentType {
  """An invoice for items the user bought."""
  INVOICE

  """An issued statement for items the user consigned."""
  STATEMENT
}

type AppointmentEdge {
  """Pass as after to get the appointments that follow this one."""
  cursor: String!
  node: Appointment!
}

enum AppointmentStatus {
  """Waiting for the house to confirm a time."""
  REQUESTED

  """The house has set the time in scheduledStart."""
  CONFIRMED
  CANCELLED
  COMPLETED
}

enum AppointmentType {
  """Collecting items on one or more invoices or statements."""
  COLLECTION

  """Bringing items to be valued."""
  VALUATION
}

"""A consignor's payout bank account."""
type BankDetails {
  """Account holder name."""
  accountName: String!

  """8-digit account number."""
  accountNumber: String!

  """6-digit sort code."""
  sortCode: String!

  """ISO 3166-1 alpha-2 country of the account (e.g. "GB")."""
  country: String!
}

"""
Payout bank details to set. Name/account/sort are required and replace the stored
set. Shape is validated server-side (8-digit account number, 6-digit sort code).
"""
input BankDetailsInput {
  accountName: String!
  accountNumber: String!
  sortCode: String!

  """
  ISO 3166-1 alpha-2 country. Optional; defaults to "GB". Only GB is supported for now.
  """
  country: String
}

type BastaLiveStream {
  """Is live stream enabled"""
  enabled: Boolean!

  """LiveStream channel ID"""
  channelId: String

  """LiveStream URL"""
  publicUrl: String

  """Is stream live"""
  isLive: Boolean! @deprecated(reason: "use our partner sdk instead, currently always true")

  """Current viewers"""
  currentViewers: Int
}

"""Bid represents a bid that has been placed."""
type Bid {
  """Bid ID"""
  id: ID!

  """Id of the sale"""
  saleId: String!

  """Id of the item"""
  itemId: String!

  """Amount of bid in minor currency unit."""
  amount: Int!

  """Max amount placed with the bid in minor currency unit."""
  maxAmount: Int

  """Date of when the bid was placed."""
  date: String!

  """Bid status of for the bid"""
  bidStatus: BidStatus

  """
  Masked identifier for the bidder. By default a stable per-sale-item hash of the
  bidder; for accounts configured to do so, the bidder's username. Null when it
  cannot be computed.
  """
  bidderIdentifier: String

  """Optional paddle if bid is associated with a paddle."""
  paddle: Paddle

  """Reactive bid if bid was placed as a side effect of a max bid"""
  reactiveBid: Boolean!

  """BidOrigin"""
  bidOrigin: BidOrigin!

  """
  Registration associated with this bid. Null when no registration ID
  is present on the bid (e.g. pre-registration bids).
  """
  registration: UserSaleRegistration
}

"""Error code when failing to place a bid on an item"""
enum BidErrorCode {
  NO_ERROR
  INTERNAL_ERROR
  MAX_BID_LOWER_THAN_CURRENT_MAX
  BID_LOWER_THAN_CURRENT_MAX
  BID_LOWER_THAN_CURRENT_BID
  ALREADY_HIGHER_MAX_BID
  OFF_INCREMENT
  STARTING_BID_HIGHER
  NOT_OPEN_FOR_BIDDING
  ITEM_CLOSING_PERIOD_PASSED
  BID_AMOUNT_UPPER_LIMIT_REACHED
  ITEM_ALREADY_CLOSED
  USER_REQUIRED_TO_HAVE_ACCEPTED_REGISTRATION_FOR_SALE
  USER_REGISTRATION_REJECTED_FOR_SALE
  USER_REGISTRATION_PENDING_FOR_SALE
}

"""
Bid increment table represent how increments behave for a
specific item or an sale.
"""
type BidIncrementTable {
  """Range rules in the table."""
  rangeRules: [RangeRule!]!
}

union BidOrigin = OnlineBidOrigin | PaddleBidOrigin | PhoneBidOrigin | Aggregator

enum BidOriginType {
  ONLINE
  PADDLE
  PHONE
  AGGREGATOR
}

union BidPlaced = BidPlacedSuccess | MaxBidPlacedSuccess | BidPlacedError

type BidPlacedError {
  """Error description if an error occured."""
  error: String!

  """Error code if an error occured"""
  errorCode: BidErrorCode!
}

"""
Bid is placed response.
Error will only appear if there was an error placing a bid, such as off increment etc.
"""
type BidPlacedSuccess {
  """bidId"""
  id: String!

  """Amount of placed bid."""
  amount: Int!

  """Server time of when the bid was placed."""
  date: String!

  """Bid Status of the bid"""
  bidStatus: BidStatus!

  """
  Registration associated with this bid placement. Null when no registration ID
  is present on the bid (e.g. pre-registration bids).
  """
  registration: UserSaleRegistration
}

"""Restrictions for bidding on a sale"""
type BidRestrictions {
  """Users need to have an accepted registration to bid on this sale"""
  acceptedRegistrationRequired: Boolean!

  """
  Whether you can request phone bidding for this sale. False once phoneRegistrationClosesAt has passed.
  """
  phoneRegistrationOpen: Boolean!

  """
  When phone registrations close, as an RFC3339 timestamp: a set number of hours before the live start
  (live sales) or before the first item starts closing (timed sales). Null when there is no cut-off.
  """
  phoneRegistrationClosesAt: String
}

"""Bid statuses that calculates in what status the bid is."""
enum BidStatus {
  """User is winning the item."""
  WINNING

  """User is losing the item."""
  LOSING

  """User has lost the item."""
  LOST

  """User has won the item."""
  WON

  """User is not bidding on the item."""
  NOT_BIDDING

  """User has withdrawn an offer for the item."""
  WITHDRAWN

  """User has submitted an offer for the item."""
  SUBMITTED
}

"""Bid Type represent what kind of bid is being placed on an item."""
enum BidType {
  """Bid is a normal bid."""
  NORMAL

  """
  Bid is the highest amount a user is willing to pay. The auction
  engine will automatically place the lowest bid necessary on behalf
  of the user until the max amount is reached.
  """
  MAX

  """Bid is an offer that the user commits to buying the item for."""
  OFFER @deprecated(reason: "no longer supported")
}

input BidderVerificationInput {
  """successful verification is redirected to this url"""
  successUrl: String!


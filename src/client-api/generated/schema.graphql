"""
Directs the executor to defer this fragment when the `if` argument is true or undefined.
"""
directive @defer(
  """Deferred when true or undefined."""
  if: Boolean = true

  """Unique name"""
  label: String
) on FRAGMENT_SPREAD | INLINE_FRAGMENT

directive @hasPermission(permission: Permission!) on FIELD_DEFINITION

type Account {
  """ID of the account"""
  id: ID!

  """Name associated with account"""
  name: String!

  """Account handle, identifier for the account"""
  handle: String

  """Description for account"""
  description: String

  """Url for the profile image"""
  imageUrl: String

  """Links associated with account"""
  links: [Link!]!

  """Indicates whether account is using basta's bid client"""
  bastaBidClient: Boolean!

  """
  Is logged-in user subscribed to account ?
  Only applies to sales running on basta.app (false for all api clients)
  """
  isUserSubscribed: Boolean!

  """PaymentDetails set by account"""
  paymentDetails: PaymentDetails

  """Metafields associated with the account"""
  metafields(input: GetMetafieldsInput): [MetafieldsConnection!]!

  """Metafield associated with the account"""
  metafield(input: GetMetafieldInput!): Metafield

  """
  Departments of the account, ordered alphabetically by name.
  Pass the previous page's endCursor as `after` to fetch the next page.
  """
  departments(
    """Number of departments to return, at most 200."""
    first: Int = 50
    after: String
  ): DepartmentConnection!
}

enum AddressType {
  BILLING
  SHIPPING
  OTHER
}

type Aggregator {
  name: String!
  type: BidOriginType!
}

type BastaLiveStream {
  """Is live stream enabled"""
  enabled: Boolean!

  """LiveStream channel ID"""
  channelId: String

  """LiveStream URL"""
  publicUrl: String

  """Is stream live"""
  isLive: Boolean! @deprecated(reason: "use our partner sdk instead, currently always true")

  """Current viewers"""
  currentViewers: Int
}

"""Bid represents a bid that has been placed."""
type Bid {
  """Bid ID"""
  id: ID!

  """Id of the sale"""
  saleId: String!

  """Id of the item"""
  itemId: String!

  """Amount of bid in minor currency unit."""
  amount: Int!

  """Max amount placed with the bid in minor currency unit."""
  maxAmount: Int

  """Date of when the bid was placed."""
  date: String!

  """Bid status of for the bid"""
  bidStatus: BidStatus

  """
  Masked identifier for the bidder. By default a stable per-sale-item hash of the
  bidder; for accounts configured to do so, the bidder's username. Null when it
  cannot be computed.
  """
  bidderIdentifier: String

  """Optional paddle if bid is associated with a paddle."""
  paddle: Paddle

  """Reactive bid if bid was placed as a side effect of a max bid"""
  reactiveBid: Boolean!

  """BidOrigin"""
  bidOrigin: BidOrigin!

  """
  Registration associated with this bid. Null when no registration ID
  is present on the bid (e.g. pre-registration bids).
  """
  registration: UserSaleRegistration
}

"""Error code when failing to place a bid on an item"""
enum BidErrorCode {
  NO_ERROR
  INTERNAL_ERROR
  MAX_BID_LOWER_THAN_CURRENT_MAX
  BID_LOWER_THAN_CURRENT_MAX
  BID_LOWER_THAN_CURRENT_BID
  ALREADY_HIGHER_MAX_BID
  OFF_INCREMENT
  STARTING_BID_HIGHER
  NOT_OPEN_FOR_BIDDING
  ITEM_CLOSING_PERIOD_PASSED
  BID_AMOUNT_UPPER_LIMIT_REACHED
  ITEM_ALREADY_CLOSED
  USER_REQUIRED_TO_HAVE_ACCEPTED_REGISTRATION_FOR_SALE
  USER_REGISTRATION_REJECTED_FOR_SALE
  USER_REGISTRATION_PENDING_FOR_SALE
}


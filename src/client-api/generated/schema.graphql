type Mutation {
  """
  Place bid on a item for some amount. Can be of type NORMAL, MAX and OFFER.
  Amount will be the max amount when bid is of type MAX.
  """
  bidOnItem(saleId: String!, itemId: String!, amount: Int!, type: BidType!): BidPlaced!

  """
  Set the user's notification preferences for one account. Only the entries
  given are changed. The returned list covers what the account sends on, so an
  entry outside it is stored but not returned.
  """
  setMyNotificationPreferences(preferences: [UserNotificationPreferenceInput!]!): [UserNotificationPreference!]!

  """
  Place a bid on a Dutch lot, requesting `quantity` units at the declared per-unit `amount`.
  `amount` must equal the lot's current clock price exactly; if the clock has ticked since the
  client read it, the bid is rejected with PRICE_MISMATCH and the client should re-read the
  current price and retry.
  """
  placeDutchBid(saleId: String!, itemId: String!, quantity: Int!, amount: Int!): DutchBidPlaced!

  """
  DEPRECATED.
  Use BidOnItem with type input = MAX.
  Place max bid on a item for some amount.
  """
  maxBidOnItem(saleId: String!, itemId: String!, maxAmount: Int!): MaxBidPlaced! @deprecated(reason: "maxBidOnItem is deprecated. Use bidOnItem with type as MAX instead.")

  """
  CreateBidderVerification.
  This method is only available to basta users and front ends written by Basta.
  """
  createBidderVerification(input: BidderVerificationInput): BidderVerificationLink!

  """
  Starts identity verification for the logged-in user, or resumes the one they
  have not finished yet. Open the verification in the browser with the handoff
  field that matches the returned provider, then read me.idVerificationStatus
  to follow its progress.
  Fails when identity verification is not enabled for the account, when the user
  is already verified, or while a submitted verification is still being checked.
  """
  createIdentityVerificationSession: IdentityVerificationSession!

  """
  AcceptBidderTerms.
  This method is only available to basta users and front ends written by Basta.
  Returns a RFC3339 timestamp of when bidder terms were accepted.
  """
  acceptBidderTerms: String!

  """
  Users with basta session can subscribe to creators running sales on basta.app.
  """
  subscribeToAccount(accountId: String!): UserAccountSubscription!

  """Unsusbscribe from an account"""
  unsubscribeFromAccount(accountId: String!): ID!

  """
  Follow a consignor (User). Idempotent. consignorId is the consignor's internal User.id.
  """
  followConsignor(consignorId: ID!): FollowConsignorResult!

  """
  Unfollow a consignor. Idempotent. consignorId is the consignor's internal User.id.
  """
  unfollowConsignor(consignorId: ID!): FollowConsignorResult!

  """Users can subscribe / favourite an item"""
  subsribeToItem(saleId: String!, itemId: String!): UserSaleItemSubscription!

  """Unsubscribe from item"""
  unsubscribeFromItem(saleId: String!, itemId: String!): ID!

  """Users can subscribe / favourite a sale."""
  subscribeToSale(saleId: String!): UserSaleSubscription!

  """Unsubscribe from sale"""
  unsubscribeFromSale(saleId: String!): ID!

  """
  Returns session credentials for selected payment provider, e.g. Stripe Customer Session
  A Customer Session allows you to grant Stripe’s frontend SDKs (like Stripe.js) client-side access control over a Customer.
  """
  createPaymentProviderSession(input: PaymentProviderSessionInput!): PaymentProviderSession!

  """Update user information."""
  updateUser(input: UpdateUserInput!): Me!

  """
  Set the logged-in user's payout bank details. All three fields are required and
  replace the stored set.
  """
  updateMyBankDetails(input: BankDetailsInput!): BankDetails!

  """
  Remove the logged-in user's payout bank details. Idempotent — returns true even
  when none were on file.
  """
  deleteMyBankDetails: Boolean!

  """Add a phone number to the logged-in user."""
  createPhone(input: CreatePhoneInput!): PhoneAddress!

  """Update one of the logged-in user's phone numbers."""
  updatePhone(input: UpdatePhoneInput!): PhoneAddress!

  """Delete one of the logged-in user's phone numbers."""
  deletePhone(phoneId: String!): Boolean!

  """Set default payment method"""
  setDefaultPaymentMethod(input: SetDefaultPaymentMethodInput!): PaymentMethod!

  """
  Submit an offer on an item as the authenticated buyer. The buyer identity is
  derived server-side from the session; it is never taken from client input.
  """
  makeOffer(input: MakeOfferInput!): Offer!

  """Counter an outstanding offer as the buyer."""
  counterOffer(input: CounterOfferInput!): Offer!

  """Accept the seller's outstanding counter on an offer."""
  acceptCounter(offerId: ID!): Offer!

  """Withdraw an offer the authenticated buyer previously made."""
  withdrawOffer(offerId: ID!): Offer!

  """
  Register the authenticated user for a sale. ONLINE and PHONE registrations
  are supported. The resulting status is decided by the sale's registration
  rules. If the user is already registered for the sale with the given type,
  the existing registration is returned unchanged.
  """
  createSaleRegistration(input: CreateSaleRegistrationInput!): UserSaleRegistration!

  """
  Register the authenticated user for a single item in a sale. A sale
  registration of the same type is created for the user when they do not have
  one yet. If the user is already registered for the item with the given type,
  the existing registration is returned unchanged.
  """
  createSaleItemRegistration(input: CreateSaleItemRegistrationInput!): UserItemRegistration!

  """
  Sign a consignment contract with the code from its signing link. Needs no login. Pass the
  code as a variable. Fails with code CONTRACT_SIGNING_UNAVAILABLE for any code that cannot
  be used, whether unknown, expired, cancelled or already signed.
  """
  signConsignmentContract(input: SignConsignmentContractInput!): SignConsignmentContractPayload!

  """
  A signed URL to upload one photo for a valuation request. Needs no login. Fails with code
  VALUATION_REQUESTS_UNAVAILABLE when the house does not accept valuation requests, and with
  BAD_USER_INPUT for a content type or size that is not allowed.
  """
  createValuationPhotoUploadUrl(input: CreateValuationPhotoUploadUrlInput!): ValuationPhotoUploadUrl!

  """
  Send a valuation request to an auction house. Needs no login. Fails with code
  VALUATION_REQUESTS_UNAVAILABLE when the house does not accept valuation requests, and with
  BAD_USER_INPUT when the input does not fit the house's form.
  """
  submitValuationRequest(input: SubmitValuationRequestInput!): SubmitValuationRequestPayload!

  """
  Request an appointment at one of the auction house's sites. Needs login. The house confirms
  the time. Fails with code APPOINTMENTS_UNAVAILABLE when the house does not take appointments,
  APPOINTMENT_LIMIT_REACHED when the user has too many requested or confirmed appointments, and
  BAD_USER_INPUT when the input is not valid, including a document that is not the user's own.
  
  Safe to retry: sending the same appointmentId again returns the appointment it created, even
  if the first response was lost, so a double click or a retry never books twice.
  """
  requestAppointment(input: RequestAppointmentInput!): Appointment!

  """
  Cancel one of the logged-in user's requested or confirmed appointments. Needs login. Fails
  with code NOT_FOUND when the user has no such appointment and APPOINTMENT_NOT_CANCELLABLE when
  it is already cancelled or completed.
  """
  cancelAppointment(input: CancelAppointmentInput!): Appointment!

  """
  Ask the auction house for a lot's condition report. Needs login only when the house's
  Account.conditionReportsRequireLogin is true; a login for another house counts as no login.
  A logged-in user may leave out name and email, which then come from their profile.
  
  Fails with code UNAUTHENTICATED when the house requires login and there is none, NOT_FOUND
  when the lot is not shown on the house's website, CONDITION_REPORT_REQUESTS_UNAVAILABLE when
  the lot or its sale has closed or the house does not exist, BAD_USER_INPUT when the input is
  not valid, REQUEST_ID_IN_USE when requestId was already sent for another lot or email, and
  RATE_LIMITED after too many requests.
  
  Safe to retry while the lot is open: sending the same requestId again returns the first result. Asking again about
  the same lot with the same email, while the house has not yet replied, adds to the first
  request instead of making a new one.
  """
  requestConditionReport(input: RequestConditionReportInput!): RequestConditionReportPayload!
}


  Unique user id of the logged in user. Not interchangeable with Consignor.userId.
  """
  userId: String!

  """First name of the logged in user."""
  firstName: String!

  """Last name of the logged in user."""
  lastName: String!

  """Email of the logged in user."""
  email: String!

  """
  Username of the logged in user. Null when the user has not set a username.
  """
  username: String

  """Whether the logged in user's email has been verified."""
  emailVerified: Boolean!

  """Get all bids that a user has placed on sales"""
  bids(first: Int!, after: String): UserBidsConnection!

  """Offers the authenticated buyer has made, most recent first."""
  offers(first: Int, after: String, status: OfferStatus): OffersConnection!

  """
  Items the authenticated buyer bought outside the auction (accepted offers / buy-nows), most recent purchase first.
  """
  directSells(first: Int = 20, after: String): DirectSellsConnection!

  """
  Consignors the logged in user follows. consignorId is the consignor's internal User.id.
  """
  followedConsignors(first: Int = 20, after: String): FollowedConsignorsConnection!

  """Accounts for logged in user"""
  accounts: [Account!]!

  """True if logged in user is a verified Basta bidder"""
  verifiedAsBidder: Boolean!

  """
  Sales the logged in user has added to their watchlist, most recently added first.
  """
  saleSubscriptions(first: Int = 20, after: String): SaleConnection!

  """
  Sale items the logged in user has added to their watchlist, most recently added first.
  """
  saleItemSubscriptions(first: Int = 20, after: String): ItemsConnection!

  """Notification settings for the logged in user."""
  notificationSettings: UserNotificationSettings!

  """Latest items that user has placed a bid on."""
  latestItemBids(first: Int): ItemsConnection!

  """Primary Billing address"""
  billingAddress: MailingAddress! @deprecated(reason: "use addresses")

  """Primary Shipping address"""
  shippingAddress: MailingAddress! @deprecated(reason: "use addresses")

  """Addresses"""
  addresses: [MailingAddress!]!

  """Phones"""
  phoneAddresses: [PhoneAddress!]!

  """Default payment method"""
  defaultPaymentMethod: PaymentMethod

  """True if the logged-in user is blocked from participating in sales."""
  blocked: Boolean!

  """
  Identity verification status of the logged-in user.
  Null when the user has never submitted identity verification.
  """
  idVerificationStatus: IdVerificationStatus

  """The logged-in user's payout bank details. Null when none are on file."""
  bankDetails: BankDetails

  """
  Pre-sale advices the auction house has emailed to the logged-in user as a consignor: the
  latest sent revision of each, most recently sent first. Empty when not logged in.
  """
  presaleAdvices(first: Int = 20, after: String): ConsignorPresaleAdviceConnection!

  """
  The logged-in user's appointments at this auction house, most recently requested first. With
  upcomingOnly, only requested and confirmed appointments that have not started, soonest first.
  Empty when not logged in.
  """
  appointments(first: Int = 20, after: String, upcomingOnly: Boolean = false): AppointmentConnection!

  """
  Whether and where the logged-in user can request an appointment at this auction house.
  enabled is false when not logged in.
  """
  appointmentBookingOptions: AppointmentBookingOptions!

  """
  The logged-in user's orders at this auction house, newest first. An order
  appears once the house has published it. Empty when not logged in. Page
  with pageInfo.endCursor as after; at most 20 per page.
  """
  orders(first: Int = 20, after: String): OrderConnection!

  """One of the logged-in user's orders. Null when there is no such order."""
  order(id: ID!): Order
}


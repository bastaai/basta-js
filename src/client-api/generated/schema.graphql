"""
Why a Dutch bid was rejected. Exactly one code is returned per rejected bid.
"""
enum DutchBidErrorCode {
  """The lot has not opened for bidding yet."""
  NOT_OPEN

  """The lot's bidding window has ended."""
  ENDED

  """Bidding is open but every unit has already been taken."""
  SOLD_OUT

  """You have reached the bid limit for this lot."""
  BIDDER_LIMIT_REACHED

  """The lot has been closed."""
  CLOSED

  """
  The declared amount did not match the lot's current clock price. Re-read the price and retry.
  """
  PRICE_MISMATCH
}

union DutchBidPlaced = DutchBidPlacedSuccess | DutchBidPlacedError

"""A rejected Dutch bid. errorCode says why the bid was not accepted."""
type DutchBidPlacedError {
